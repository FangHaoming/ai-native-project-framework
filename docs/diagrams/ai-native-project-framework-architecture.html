  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5;
      --ink: #2d3142;
      --muted: #4f5d75;
      --soft: #7a8399;
      --accent: #eb6c36;
      --link: #2e5aa8;

      --serif: 'Instrument Serif', 'Songti SC', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      min-height: 100vh;
      padding: 48px 32px;
      overflow-x: auto;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);

    main { width: min(100%, 1280px); margin: 0 auto; }
    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font: 500 10px/1.4 var(--mono);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin-bottom: 8px;
      color: var(--ink);
      font: 400 clamp(28px, 3vw, 40px)/1.08 var(--serif);
      letter-spacing: -0.02em;
    }
    .subtitle {
      max-width: 760px;
      margin-bottom: 28px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .diagram { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1040px; height: auto; }
    .footnote {
      padding-top: 16px;
      border-top: 1px solid rgba(45,49,66,0.12);
      color: var(--soft);
      font: 400 10px/1.6 var(--mono);
    }
  </style>
